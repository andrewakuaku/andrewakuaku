<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .stroke { stroke: #0a0a0a; }
    .dot { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .stroke { stroke: #ffffff; }
      .dot { fill: #ffffff; }
    }
  </style>
  <g class="stroke" fill="none" stroke-width="17" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- A1 with flat-top apex (matches Space Grotesk 700) -->
    <path d="M9 90 L29 14 L41 14 L52 90" />
    <line x1="20" y1="56" x2="42" y2="56" stroke-width="14" />
    <!-- A2 — left leg overlaps the right leg of A1 in the middle -->
    <path d="M38 90 L58 14 L70 14 L81 90" />
    <line x1="49" y1="56" x2="71" y2="56" stroke-width="14" />
  </g>
  <!-- Period dot, same near-black as the strokes (matches the on-page .dot) -->
  <circle class="dot" cx="92" cy="85" r="6" />
</svg>
